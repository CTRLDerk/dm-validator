name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Engine, schema, texts and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (no dependencies)
        run: npm test

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (Chromium only, not saved in package.json)
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm run test:browser
