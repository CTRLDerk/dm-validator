name: check

# Kwaliteitscontrole bij elke push en PR. Publiceert niets: GitHub Pages
# toont pas iets nieuws nadat jij een PR naar main hebt gemerged.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repo-controle (syntaxis, JSON, vertalingen, engine)
        run: node tools/check.js
